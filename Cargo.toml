[package]
name = "statusbar"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["clock"] }
eframe = "0.36.1"
hmac = "0.13.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls", "cookies"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
tray-icon = "0.24.2"
urlencoding = "2.1.3"
uuid = { version = "1.26.0", features = ["v4"] }
vim_macros = "0.6.0"
vim_rs = { version = "0.6", default-features = false, features = ["xml"] }
